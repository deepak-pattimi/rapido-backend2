name: KVM 1 CI and deployment
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node ops/check-syntax.cjs
      - run: bash -n ops/kvm1-deploy.sh
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: kvm1-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit and verify health
        env:
          DEPLOY_KEY: ${{ secrets.KVM1_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KVM1_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/kvm1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/kvm1' EXIT
          ssh -i ~/.ssh/kvm1 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@200.234.34.174 "deploy $COMMIT_SHA"
